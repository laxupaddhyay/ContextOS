server:
  port: 8080
spring:
  servlet:
    multipart:
      max-file-size: 21MB
      max-request-size: 21MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/contextos}
    username: ${SPRING_DATASOURCE_USERNAME:contextos}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me-local}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/migration/V1__init.sql,classpath:db/migration/V2__chunk_embeddings.sql,classpath:db/migration/V3__oidc_identities.sql
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
management:
  endpoints:
    web:
      exposure:
        include: health,info
contextos:
  ai-base-url: ${AI_BASE_URL:http://localhost:8000}
  ai-service-token: ${AI_SERVICE_TOKEN:dev-only-change-me}
  storage: ${FILE_STORAGE_PATH:./uploads}
  max-upload-bytes: ${MAX_UPLOAD_BYTES:20971520}
  cors-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  oidc-issuer: ${OIDC_ISSUER_URI:}
  oidc-audience: ${OIDC_API_AUDIENCE:}
