services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-contextos}
      POSTGRES_USER: ${POSTGRES_USER:-contextos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data", "../services/api/src/main/resources/db/migration/V1__init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro", "../services/api/src/main/resources/db/migration/V2__chunk_embeddings.sql:/docker-entrypoint-initdb.d/02-chunk-embeddings.sql:ro", "../services/api/src/main/resources/db/migration/V3__oidc_identities.sql:/docker-entrypoint-initdb.d/03-oidc-identities.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-contextos} -d ${POSTGRES_DB:-contextos}"]
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
  ai:
    build: ../services/ai
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GENERATION_MODEL: ${GENERATION_MODEL:-gpt-4o-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-dev-only-change-me}
    ports: ["127.0.0.1:8000:8000"]
  api:
    build: ../services/api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-contextos}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-contextos}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
      AI_BASE_URL: http://ai:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-dev-only-change-me}
      RABBITMQ_HOST: rabbitmq
      FILE_STORAGE_PATH: /data/uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-20971520}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-}
      OIDC_API_AUDIENCE: ${OIDC_API_AUDIENCE:-}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["uploads:/data/uploads"]
    depends_on:
      db: { condition: service_healthy }
      rabbitmq: { condition: service_started }
      ai: { condition: service_started }
  web:
    build: ../apps/web
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
      VITE_AUTH_MODE: ${VITE_AUTH_MODE:-local}
      VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY:-}
      VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-}
      VITE_OIDC_SCOPE: ${VITE_OIDC_SCOPE:-openid profile email}
    ports: ["127.0.0.1:5173:5173"]
    depends_on: [api]
volumes:
  pgdata:
  uploads:
